name: 'ChangeLog JSON'
description: 'GitHub Action that uses the GitHub API an generates a JSON file with the changelog'
author: darko.krizic@prodyna.com
inputs:
  github-token:
    description: 'The GitHub Token to use for authentication'
    required: true
  repositories:
    description: 'The repositories to query for the changelog'
    required: true
  organization:
    description: 'The organization to query for the repositories'
    required: true
  output-file:
    description: 'The output file to write the changelog to'
    required: true
    default: 'CHANGELOG.json'
  expand-links:
    description: 'Expand the links in the changelog'
    required: false
    default: 'true'
  github-graphql-url:
    description: 'The GitHub GraphQL API endpoint. Defaults to the endpoint of the current GitHub instance, which allows usage on GitHub Enterprise.'
    required: false
    default: ${{ github.graphql_url }}
  github-server-url:
    description: 'The GitHub server URL used to expand links. Defaults to the URL of the current GitHub instance, which allows usage on GitHub Enterprise.'
    required: false
    default: ${{ github.server_url }}
runs:
  using: 'docker'
  image: 'docker://ghcr.io/prodyna/changelog-json:v1.6'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    REPOSITORIES: ${{ inputs.repositories }}
    ORGANIZATION: ${{ inputs.organization }}
    OUTPUT_FILE: ${{ inputs.output-file }}
    EXPAND_LINKS: ${{ inputs.expand-links }}
    GITHUB_GRAPHQL_URL: ${{ inputs.github-graphql-url }}
    GITHUB_SERVER_URL: ${{ inputs.github-server-url }}
